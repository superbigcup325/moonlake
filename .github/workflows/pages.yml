name: pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # The page embeds the whole engine, so an engine change ships with it:
      # limiting this to playground/** left the deployed wasm on 0.1.0 while
      # the 0.3.0 engine was on main.
      - playground/**
      - engine/**
      - sources/**
      - types/**
      - sql/**
      - catalog/**
      - spill/**
      - moonlake.mbt
      - moon.pkg
      - moon.mod

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.10.18+6c83a7f62
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: "Toolchain version (floor: moonc 0.10.16)"
        run: |
          moon version --all
          moonc -v | grep -qE '^v(0\.10\.(1[6-9]|[2-9][0-9])|0\.(1[1-9]|[2-9][0-9])\.[0-9]|[1-9][0-9]*\.)' || {
            echo "moonc 0.10.16 or newer is required" >&2
            exit 1
          }
      - name: Update registry index
        run: |
          moon update
          # Dependencies resolve and download on the next check/build/test: as
          # of 0.1.20261016 `moon install` installs a binary package and needs
          # a SOURCE, so it is no longer a dependency fetch. A dependency that
          # still ships the legacy moon.mod.json fails loudly during the graph
          # resolution there.
      - name: Build the playground wasm
        run: moon build --target wasm-gc playground
      - name: Assemble site
        run: |
          mkdir site
          cp playground/index.html site/
          cp _build/wasm-gc/debug/build/playground/playground.wasm site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
