name: pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - playground/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Fetch dependencies
        run: |
          moon update
          # `moon install` aborts on dependencies still shipping the
          # legacy moon.mod.json manifest, after extracting what it can.
          # Alternate install attempts with `moon fmt` migrations until
          # none remain, then gate on a final install.
          for i in 1 2 3 4 5; do
            moon install && break
            for d in .mooncakes/*/*/; do
              if [ -f "$d/moon.mod.json" ]; then (cd "$d" && moon fmt); fi
            done
          done
          moon install
      - name: Build the playground wasm
        run: moon build --target wasm-gc playground
      - name: Assemble site
        run: |
          mkdir site
          cp playground/index.html site/
          cp _build/wasm-gc/debug/build/playground/playground.wasm site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
