# Nightly verification: the randomized evidence lines at larger N than
# the per-commit budget allows. Property tests here run the same suite
# (fixed N in-code); the pushdown fuzzer scales via argv.
name: nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Update registry index
        run: |
          moon update
          # Dependencies resolve and download on the next check/build/test: as
          # of 0.1.20261016 `moon install` installs a binary package and needs
          # a SOURCE, so it is no longer a dependency fetch. A dependency that
          # still ships the legacy moon.mod.json fails loudly during the graph
          # resolution there.
      - name: Install duckdb
        run: python3 -m pip install --quiet duckdb
      - name: Build the native CLI
        run: moon build cmd/main --target native
      - name: Tests (native)
        run: moon test
      - name: Predicate-tree fuzzer (1200 queries, duckdb-refereed)
        run: python3 harness/fuzz_pushdown.py 1200 20261006
      - name: Golden chain
        run: |
          python3 harness/gen_tpch.py
          python3 harness/gen_multigroup.py
          python3 harness/gen_parquet_fixtures.py
          bash harness/check_all.sh
      - name: Parquet corpus cross-check (apache/parquet-testing)
        run: python3 harness/check_parquet_corpus.py
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Writer interop (pyarrow + duckdb, both directions)
        run: uv run --with duckdb --with pyarrow python harness/check_writer_interop.py
