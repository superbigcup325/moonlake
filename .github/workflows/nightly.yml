# Nightly verification: the randomized evidence lines at larger N than
# the per-commit budget allows. Property tests here run the same suite
# (fixed N in-code); the pushdown fuzzer scales via argv.
name: nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Update registry index
        run: |
          moon update
          # Dependencies resolve and download on the next check/build/test: as
          # of 0.1.20261016 `moon install` installs a binary package and needs
          # a SOURCE, so it is no longer a dependency fetch. A dependency that
          # still ships the legacy moon.mod.json fails loudly during the graph
          # resolution there.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install reference tools (pinned)
        run: |
          python3 -m pip install --quiet -r harness/requirements.txt
          python3 -c 'import sys, duckdb, pyarrow; print(sys.version); print(f"DuckDB {duckdb.__version__}, PyArrow {pyarrow.__version__}")'
      - name: Build the native CLI
        run: moon build cmd/main --target native
      - name: Tests (native)
        run: moon test --target native
      - name: Predicate-tree fuzzer (1200 queries, duckdb-refereed)
        run: python3 harness/fuzz_pushdown.py 1200 20261006
      - name: Parquet encoding evidence (page level)
        env:
          MOONLAKE_BIN: _build/native/debug/build/cmd/main/main.exe
        run: python3 harness/check_colenc_fixtures.py
      - name: Benchmark answers agree with duckdb
        env:
          # no release build in this job: the oracle only needs a CLI, not a
          # timed binary, so correctness runs on the debug binary
          MOONLAKE_BIN: _build/native/debug/build/cmd/main/main.exe
        run: python3 harness/bench_release.py --check-oracles --no-build --binary _build/native/debug/build/cmd/main/main.exe
      - name: Window differential (seeded random fixture)
        env:
          MOONLAKE_BIN: _build/native/debug/build/cmd/main/main.exe
        run: python3 harness/check_windows.py --random 400 --seed 20261023
      - name: Golden chain
        run: |
          python3 harness/gen_tpch.py
          python3 harness/gen_multigroup.py
          python3 harness/gen_parquet_fixtures.py
          bash harness/check_all.sh
      - name: Parquet corpus cross-check (apache/parquet-testing)
        env:
          # the check now decodes every column, so a `moon run` per query would
          # pay the build path ~five times per file; use the binary built above
          MOONLAKE_BIN: _build/native/debug/build/cmd/main/main.exe
        run: python3 harness/check_parquet_corpus.py
      - name: Writer interop (pyarrow + duckdb, both directions)
        run: python3 harness/check_writer_interop.py
