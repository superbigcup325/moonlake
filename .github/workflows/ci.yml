name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Update registry index
        run: |
          moon update
          # Dependencies resolve and download on the next check/build/test: as
          # of 0.1.20261016 `moon install` installs a binary package and needs
          # a SOURCE, so it is no longer a dependency fetch. A dependency that
          # still ships the legacy moon.mod.json fails loudly during the graph
          # resolution there.
      - name: Lint (check --deny-warn)
        run: moon check --deny-warn
      - name: Format check
        run: moon fmt --check
      - name: Interface freshness (info)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

  test:
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update registry index
        run: |
          moon update
          # Dependencies resolve and download on the next check/build/test: as
          # of 0.1.20261016 `moon install` installs a binary package and needs
          # a SOURCE, so it is no longer a dependency fetch. A dependency that
          # still ships the legacy moon.mod.json fails loudly during the graph
          # resolution there.
      - name: Test (${{ matrix.target }})
        run: moon test --target ${{ matrix.target }}

  tpch:
    # Full-chain cross-validation: regenerate TPC-H data and duckdb's
    # answers from scratch in CI, then diff moonlake output per query.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Update registry index
        run: |
          moon update
          # Dependencies resolve and download on the next check/build/test: as
          # of 0.1.20261016 `moon install` installs a binary package and needs
          # a SOURCE, so it is no longer a dependency fetch. A dependency that
          # still ships the legacy moon.mod.json fails loudly during the graph
          # resolution there.
      - name: Install duckdb
        run: python3 -m pip install --quiet duckdb
      - name: Generate TPC-H data and golden answers
        run: |
          python3 harness/gen_tpch.py
          python3 harness/gen_parquet_fixtures.py
          python3 harness/gen_multigroup.py
      - name: Cross-validate golden queries
        run: bash harness/check_all.sh
