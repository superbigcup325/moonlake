name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Fetch dependencies
        run: |
          moon update
          moon install
          # dependencies published before the moon.mod manifest migration
          # still ship moon.mod.json; `moon fmt` migrates them in place
          for d in .mooncakes/*/*/; do
            if [ -f "$d/moon.mod.json" ]; then (cd "$d" && moon fmt); fi
          done
          # dependencies published before the moon.mod manifest migration
          # still ship moon.mod.json; `moon fmt` migrates them in place
          for d in .mooncakes/*/*/; do
            if [ -f "$d/moon.mod.json" ]; then (cd "$d" && moon fmt); fi
          done
      - name: Lint (check --deny-warn)
        run: moon check --deny-warn
      - name: Format check
        run: moon fmt --check
      - name: Interface freshness (info)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

  test:
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: |
          moon update
          moon install
          # dependencies published before the moon.mod manifest migration
          # still ship moon.mod.json; `moon fmt` migrates them in place
          for d in .mooncakes/*/*/; do
            if [ -f "$d/moon.mod.json" ]; then (cd "$d" && moon fmt); fi
          done
      - name: Test (${{ matrix.target }})
        run: moon test --target ${{ matrix.target }}

  tpch:
    # Full-chain cross-validation: regenerate TPC-H data and duckdb's
    # answers from scratch in CI, then diff moonlake output per query.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Fetch dependencies
        run: |
          moon update
          moon install
          # dependencies published before the moon.mod manifest migration
          # still ship moon.mod.json; `moon fmt` migrates them in place
          for d in .mooncakes/*/*/; do
            if [ -f "$d/moon.mod.json" ]; then (cd "$d" && moon fmt); fi
          done
          # dependencies published before the moon.mod manifest migration
          # still ship moon.mod.json; `moon fmt` migrates them in place
          for d in .mooncakes/*/*/; do
            if [ -f "$d/moon.mod.json" ]; then (cd "$d" && moon fmt); fi
          done
      - name: Install duckdb
        run: python3 -m pip install --quiet duckdb
      - name: Generate TPC-H data and golden answers
        run: |
          python3 harness/gen_tpch.py
          python3 harness/gen_multigroup.py
      - name: Cross-validate golden queries
        run: bash harness/check_all.sh
