name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Update registry index
        run: |
          moon update
          # Dependencies resolve and download on the next check/build/test: as
          # of 0.1.20261016 `moon install` installs a binary package and needs
          # a SOURCE, so it is no longer a dependency fetch. A dependency that
          # still ships the legacy moon.mod.json fails loudly during the graph
          # resolution there.
      - name: Lint (check --deny-warn)
        run: moon check --deny-warn
      - name: Format check
        run: moon fmt --check
      - name: Interface freshness (info)
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Packaged consumer (native / wasm-gc / js, fresh dependencies)
        run: python3 harness/check_consumer.py
      - name: Playground wasm is host-free
        # The browser page instantiates with no imports beyond the JS string
        # builtins, so any other Wasm import (e.g. the wasm host's filesystem
        # module, reachable whenever `scan_file` is linked) makes the page fail
        # to load. 0.3.0 shipped exactly that, and the page stayed broken until
        # a manual browser check caught it.
        run: |
          moon build --target wasm-gc playground
          node -e '
            const fs = require("fs");
            const path = "_build/wasm-gc/debug/build/playground/playground.wasm";
            const imports = WebAssembly.Module.imports(new WebAssembly.Module(fs.readFileSync(path)));
            const host = imports.filter(i => i.module !== "wasm:js-string" && i.module !== "_");
            if (host.length) {
              console.error("playground.wasm imports a host module:", host);
              process.exit(1);
            }
            console.log("playground.wasm imports only the js-string builtins");
          '

  test:
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Update registry index
        run: |
          moon update
          # Dependencies resolve and download on the next check/build/test: as
          # of 0.1.20261016 `moon install` installs a binary package and needs
          # a SOURCE, so it is no longer a dependency fetch. A dependency that
          # still ships the legacy moon.mod.json fails loudly during the graph
          # resolution there.
      - name: Test (${{ matrix.target }})
        run: moon test --target ${{ matrix.target }}

  tpch:
    # Full-chain cross-validation: regenerate TPC-H data and duckdb's
    # answers from scratch in CI, then diff moonlake output per query.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Update registry index
        run: |
          moon update
          # Dependencies resolve and download on the next check/build/test: as
          # of 0.1.20261016 `moon install` installs a binary package and needs
          # a SOURCE, so it is no longer a dependency fetch. A dependency that
          # still ships the legacy moon.mod.json fails loudly during the graph
          # resolution there.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install reference tools (pinned)
        run: |
          python3 -m pip install --quiet -r harness/requirements.txt
          python3 -c 'import sys, duckdb, pyarrow; print(sys.version); print(f"DuckDB {duckdb.__version__}, PyArrow {pyarrow.__version__}")'
      - name: Generate TPC-H data and golden answers
        run: |
          python3 harness/gen_tpch.py
          python3 harness/gen_parquet_fixtures.py
          python3 harness/gen_multigroup.py
      - name: Cross-validate golden queries
        run: bash harness/check_all.sh
      - name: Spill lifecycle
        run: bash harness/spill_accept.sh

  playground:
    # The page is the artifact candidates click first, and 0.3.0 shipped a wasm
    # that could not instantiate at all. The import gate below catches that
    # class; this job drives the real page in a real browser: upload, register,
    # join across files, plan panel, drop, error paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Update registry index
        run: moon update
      - name: Build the playground wasm
        run: moon build --target wasm-gc playground
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm i --silent playwright
          npx playwright install --with-deps chromium
      - name: Playground acceptance (real browser)
        run: |
          mkdir -p site
          cp playground/index.html site/
          cp _build/wasm-gc/debug/build/playground/playground.wasm site/
          python3 -m http.server 8971 --directory site &
          sleep 1
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright" \
            node harness/playground_accept.cjs http://127.0.0.1:8971/index.html

  writer:
    # The write path is only worth having if software that did not write the
    # file reads it correctly: pyarrow and duckdb check the schema (STRING vs
    # BLOB, DATE vs INT32), the values and the NULLs, and duckdb writes a file
    # moonlake has to read back.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Update registry index
        run: moon update
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install reference tools (pinned)
        run: |
          python3 -m pip install --quiet -r harness/requirements.txt
          python3 -c 'import sys, duckdb, pyarrow; print(sys.version); print(f"DuckDB {duckdb.__version__}, PyArrow {pyarrow.__version__}")'
      - name: Corpus gate self-tests
        run: python3 -m unittest discover -s harness -p 'test_*.py'
      - name: Writer interop (pyarrow + duckdb, both directions)
        run: python3 harness/check_writer_interop.py
