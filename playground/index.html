<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moonlake playground</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; } h1 code { font-size: 1.1rem; }
  .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin: .75rem 0; }
  textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: .9rem; min-height: 5.5rem; }
  button { padding: .45rem 1.1rem; font-size: 1rem; cursor: pointer; }
  #status { font-size: .9rem; opacity: .85; }
  table { border-collapse: collapse; font-size: .85rem; margin-top: .75rem; }
  th, td { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); padding: .25rem .55rem; text-align: left; }
  th { background: color-mix(in srgb, currentColor 8%, transparent); }
  .drop { border: 2px dashed color-mix(in srgb, currentColor 40%, transparent); border-radius: .5rem;
          padding: 1rem; text-align: center; font-size: .9rem; }
  .drop.over { border-color: highlight; }
  .err { color: #c0392b; font-family: ui-monospace, monospace; font-size: .85rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1><code>moonlake</code> playground</h1>
<p>The whole analytical engine, compiled to WebAssembly GC — your file never leaves the browser, no server, no external wasm modules.</p>

<div class="drop" id="drop">drop a <code>.csv</code> or <code>.parquet</code> file here, or
  <input type="file" id="file" accept=".csv,.parquet,text/csv">
  <div id="loaded"></div>
  <div>parquet DATE columns: <input type="text" id="datecols" placeholder="comma-separated, e.g. l_shipdate" style="width:16rem"></div>
</div>

<div class="row">
  <textarea id="sql" spellcheck="false">SELECT l_returnflag, count(*) AS n, sum(l_extendedprice) AS total
FROM lineitem
WHERE l_shipdate <= date '1998-09-02'
GROUP BY l_returnflag
ORDER BY l_returnflag</textarea>
</div>
<div class="row">
  <button id="run" disabled>Run (Ctrl+Enter)</button>
  <span id="status">load a CSV or Parquet file to begin</span>
</div>
<div class="err" id="err"></div>
<div id="out"></div>

<script type="module">
const $ = id => document.getElementById(id);
let instance;

const resp = await fetch('./playground.wasm');
const { instance: inst } = await WebAssembly.instantiate(await resp.arrayBuffer(), {}, {
  builtins: ['js-string'], importedStringConstants: '_',
});
instance = inst;
$('status').textContent = `engine ${instance.exports.version()} loaded (wasm-gc)`;

let load = null; // (sql) => JSON string, set by whichever loader ran

function loadCSV(text, name) {
  const stem = name.replace(/\.csv$/i, '');
  load = sql => instance.exports.run(text, stem, sql);
  afterLoad(name, text.length);
}

async function loadParquet(buf, name) {
  const stem = name.replace(/\.parquet$/i, '');
  // binary string: one char per byte, byte-faithful (windows-1252
  // decoding is NOT — it remaps 0x80-0x9F)
  const bytes = new Uint8Array(buf);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  load = sql => {
    const cols = $('datecols').value.trim();
    return instance.exports.run_parquet(bin, stem, cols, sql);
  };
  afterLoad(name, buf.byteLength);
}

function afterLoad(name, size) {
  $('loaded').textContent = `loaded ${name} (${(size / 1e6).toFixed(1)} MB)`;
  $('run').disabled = false;
  $('status').textContent = 'ready';
}

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  if (/\.parquet$/i.test(f.name)) {
    f.arrayBuffer().then(b => loadParquet(b, f.name));
  } else {
    f.text().then(t => loadCSV(t, f.name));
  }
});
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  if (/\.parquet$/i.test(f.name)) {
    f.arrayBuffer().then(b => loadParquet(b, f.name));
  } else {
    f.text().then(t => loadCSV(t, f.name));
  }
});

function render(out, ms) {
  const rows = JSON.parse(out);
  $('status').textContent = `${rows.length} rows in ${ms.toFixed(0)} ms`;
  if (!rows.length) { $('out').innerHTML = '<p><em>empty result</em></p>'; return; }
  const cols = Object.keys(rows[0]);
  const html = rows.map(r => '<tr>' + cols.map(c => `<td>${String(r[c] ?? '').replace(/</g, '&lt;')}</td>`).join('') + '</tr>').join('');
  $('out').innerHTML =
    `<table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${html}</tbody></table>`;
}

async function runSQL() {
  if (!load) return;
  $('err').textContent = ''; $('out').innerHTML = '';
  const t0 = performance.now();
  let out;
  try {
    out = load($('sql').value);
  } catch (e) { $('err').textContent = String(e); return; }
  const ms = performance.now() - t0;
  try {
    const parsed = JSON.parse(out);
    if (parsed && parsed.error) { $('err').textContent = parsed.error; $('status').textContent = 'failed'; return; }
    render(out, ms);
  } catch { $('err').textContent = out; }
}
$('run').addEventListener('click', runSQL);
addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') runSQL(); });
</script>
</body>
</html>
